services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rizn
      POSTGRES_PASSWORD: rizn
      POSTGRES_DB: rizn
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rizn"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:
